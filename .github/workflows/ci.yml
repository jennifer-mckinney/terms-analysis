name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

# Issue #91 round 3 (security CI note): least-privilege token for every job.
# No job writes to the repo, issues or PRs.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check style and imports
        run: ruff check src/backend/app

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install --prefer-binary -r src/backend/requirements.txt
          pip install --prefer-binary -r src/webapp/requirements.txt
          pip install --prefer-binary \
            "pytest-asyncio>=0.21.0" \
            pytest-cov \
            respx

      - name: Run test suite with coverage
        working-directory: src/backend
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=98 \
            --cov-precision=2 \
            -v
        # Floor: 98% (owner standard). --cov-precision=2 makes the exit-code
        # gate compare at 2 decimals: with the default precision 0, pytest-cov
        # rounds e.g. 97.58 up to 98 and exits 0 while printing FAIL (#177).
        # src/backend/.coveragerc sets the same precision for local runs.
        # Branch coverage is not gated yet (tracked under G3).

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit for known CVEs
        run: pip-audit -r src/backend/requirements.txt
