name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check style and imports
        run: ruff check src/backend/app

      - name: Check shared P9 files against companion PR
        run: |
          sibling="$(mktemp -d)"
          trap 'rm -rf "$sibling"' EXIT
          git -C "$sibling" init --quiet
          git -C "$sibling" fetch --quiet --no-tags --depth=1 \
            https://github.com/jennifer-mckinney/legal-corpus-ingester.git \
            refs/pull/11/head
          for file in .githooks/pre-push scripts/install-hooks.sh; do
            if ! git -C "$sibling" show "FETCH_HEAD:$file" | cmp -s - "$file"; then
              echo "P9 shared file differs from legal-corpus-ingester PR #11: $file" >&2
              exit 1
            fi
          done

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install --prefer-binary -r src/backend/requirements.txt
          pip install --prefer-binary -r src/webapp/requirements.txt
          pip install --prefer-binary \
            "pytest-asyncio>=0.21.0" \
            pytest-cov \
            respx

      - name: Run test suite with coverage
        working-directory: src/backend
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=98 \
            -v
        # Floor: 98%. Current coverage is ~62% — CI will stay red on this
        # check until the /write-tests work is complete.

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit for known CVEs
        run: pip-audit -r src/backend/requirements.txt
