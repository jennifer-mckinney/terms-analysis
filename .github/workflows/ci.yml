name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Check style and imports
        run: ruff check src/backend/app

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          pip install --prefer-binary -r src/backend/requirements.txt
          pip install --prefer-binary -r src/webapp/requirements.txt
          pip install --prefer-binary \
            "pytest-asyncio>=0.21.0" \
            pytest-cov \
            respx

      # Cross-repo P9 hook parity (terms-analysis#175, Copilot C3): compare
      # against the sibling's branch of the same name when it exists, else main.
      - name: Resolve sibling ref for P9 hook parity
        id: p9_sibling
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref="$(bash scripts/ci/p9-sibling-parity.sh resolve-ref jennifer-mckinney/legal-corpus-ingester "${HEAD_REF}")"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: P9 hook parity with legal-corpus-ingester (must run, never skip)
        working-directory: src/backend
        env:
          P9_SIBLING_REF: ${{ steps.p9_sibling.outputs.ref }}
        run: bash ../../scripts/ci/p9-sibling-parity.sh check tests/test_p9_gate_copilot.py::test_pre_push_hook_matches_the_sibling_repos_published_hook

      - name: Run test suite with coverage
        working-directory: src/backend
        env:
          P9_SIBLING_REF: ${{ steps.p9_sibling.outputs.ref }}
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=98 \
            -v
        # Floor: 98%. Current coverage is ~62% — CI will stay red on this
        # check until the /write-tests work is complete.

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit for known CVEs
        run: pip-audit -r src/backend/requirements.txt
