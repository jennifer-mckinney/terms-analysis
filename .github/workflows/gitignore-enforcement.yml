name: enforce-gitignore-invariants

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token (CodeQL alert #2): the job only reads the checkout.
permissions:
  contents: read

jobs:
  enforce-gitignore-invariants:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tree guard step runs Python; pin it like every other workflow.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Load required patterns from SSoT
        id: load_required
        run: |
          set -euo pipefail
          SSOT=".claude/governance/required-gitignore.txt"
          if [[ ! -f "${SSOT}" ]]; then
            echo "::error::required-gitignore SSoT missing: ${SSOT}"
            exit 1
          fi
          # Emit newline-delimited list, stripping comments and blanks.
          REQUIRED_LIST="$(grep -v '^[[:space:]]*#' "${SSOT}" | grep -v '^[[:space:]]*$' || true)"
          {
            echo "required<<EOF"
            echo "${REQUIRED_LIST}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Assert required .gitignore patterns are present
        env:
          REQUIRED: ${{ steps.load_required.outputs.required }}
        run: |
          set -euo pipefail
          while IFS= read -r p; do
            [[ -z "${p}" ]] && continue
            if ! grep -Fxq "${p}" .gitignore; then
              echo "::error::.gitignore is missing required pattern: \`${p}\`"
              exit 1
            fi
          done <<< "${REQUIRED}"

      - name: Assert no protected pattern was removed vs base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          REQUIRED: ${{ steps.load_required.outputs.required }}
        run: |
          set -euo pipefail
          git fetch origin "${BASE_REF}" --depth=1 || true
          REMOVED="$(git diff "origin/${BASE_REF}" -- .gitignore | grep -E '^-[^-]' | sed 's/^-//' || true)"
          while IFS= read -r p; do
            [[ -z "${p}" ]] && continue
            if echo "${REMOVED}" | grep -Fxq "${p}"; then
              echo "::error::PR removes protected .gitignore pattern: \`${p}\`"
              exit 1
            fi
          done <<< "${REQUIRED}"

      - name: Assert tracked tree passes the tree guard
        # #145 / #236: the same scanner as .githooks/pre-commit check 5 (F10).
        # Over every tracked entry: no home path in a blob, symlink target or
        # path name, no file under a graveyard directory at any depth, no .env
        # look-alike (case, Cf and homoglyph folded). The guard never prints
        # file content (F8). Fail closed: pass only on exit 0 with the exact
        # "CLEAN <n>" last line.
        run: |
          set -euo pipefail
          GUARD="scripts/governance/tree_guard.py"
          PATTERNS=".claude/governance/personal-path-patterns.txt"
          SSOT=".claude/governance/required-gitignore.txt"
          OUT="$(mktemp)"
          trap 'rm -f "${OUT}"' EXIT
          rc=0
          python3 -I "${GUARD}" "${PATTERNS}" "${SSOT}" > "${OUT}" 2>&1 || rc=$?
          last="$(tail -n 1 "${OUT}")"
          if [[ "${rc}" -eq 0 ]] && [[ "${last}" =~ ^CLEAN\ [0-9]+$ ]]; then
            echo "tree guard: ${last}"
            exit 0
          fi
          echo "::error::tree guard refused the tree (exit ${rc}):"
          cat "${OUT}"
          exit 1
