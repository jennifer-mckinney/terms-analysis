name: P9 Review

# P9 independent review as standard CI jobs (terms-analysis#191).
# Two Claude reviewers run on every pull request to main. Each one posts a
# summary comment on the PR and writes p9-verdict.json; the job fails unless
# the verdict is PASS with zero findings (.github/p9/check_verdict.py).
# Branch protection on main requires both jobs: security-review, grumpy-review.
#
# Auth: the ANTHROPIC_API_KEY repo secret. Fork PRs receive no secrets, so the
# review step fails and the job fails closed.
# Only fixed, non-user-controlled values (repo name, PR number, SHAs) reach the
# prompt; no PR title, body or branch name is interpolated anywhere.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Nothing by default; each job grants only what it uses.
permissions: {}

# A new push to the PR cancels the review of the superseded commit.
concurrency:
  group: p9-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: security-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # A verdict file committed in the PR must never count as the review, and
      # the gate runs from a copy taken before the reviewer can edit the tree.
      - name: Prepare verdict gate
        run: |
          rm -f p9-verdict.json
          cp .github/p9/check_verdict.py "$RUNNER_TEMP/check_verdict.py"

      - name: Security review
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            The PR is checked out in the current working directory.
            Read .github/p9/security-engineer.md and follow it exactly,
            including its verdict contract.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: Gate on the security verdict
        run: python3 "$RUNNER_TEMP/check_verdict.py" p9-verdict.json

  grumpy-review:
    name: grumpy-review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      # Same guard as security-review: no committed verdict, gate copied first.
      - name: Prepare verdict gate
        run: |
          rm -f p9-verdict.json
          cp .github/p9/check_verdict.py "$RUNNER_TEMP/check_verdict.py"

      - name: Code-quality review
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE SHA: ${{ github.event.pull_request.base.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            The PR is checked out in the current working directory.
            Read .github/p9/grumpy-developer.md and follow it exactly,
            including its verdict contract.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"

      - name: Gate on the code-quality verdict
        run: python3 "$RUNNER_TEMP/check_verdict.py" p9-verdict.json
