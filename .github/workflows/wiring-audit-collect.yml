name: Wiring audit (collect)

# Weekly "is it wired" audit, step 2 of 2 (card #224, ADR 0002). A day after
# wiring-audit-submit.yml, downloads the batch hand-off of every trusted submit
# run created within lookback_days (oldest first), checks each batch against the
# result contract (ended, every request present once and succeeded, end_turn,
# schema-valid output, the canary's defect reported), files the findings as
# issues through the REST API, logs the actual cost, and deletes the batch on
# every exit path. Code and config: scripts/audit/ (the cron below is pinned
# to config.json by a test).
#
# Model output never reaches a shell: the only step that sees it is the
# Python collector, which posts validated, escaped fields. Conditions as in
# the submit workflow: GitHub-hosted, schedule and dispatch only, default
# branch and wiring-audit environment only, SHA pins, least privilege.

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

# Nothing by default; the job grants only what it uses.
permissions: {}

concurrency:
  group: wiring-audit-collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: wiring-audit
    # Longer than the 600 s cancel timeout in config.json.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Require the wiring-audit API key
        env:
          WIRING_AUDIT_API_KEY: ${{ secrets.WIRING_AUDIT_API_KEY }}
        run: |
          if [ -z "${WIRING_AUDIT_API_KEY//[[:space:]]/}" ]; then
            echo "::error title=wiring-audit::MISSING_SECRET: the WIRING_AUDIT_API_KEY secret is not set in the wiring-audit environment. Add the dedicated audit key there (ADR 0002 condition 4)."
            exit 1
          fi
          echo "wiring-audit: WIRING_AUDIT_API_KEY is set"

      # Full history, so the download step can prove each run's head commit is
      # on the default branch (git merge-base --is-ancestor).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      # Attack sketch T10 and PR #282 review: a hand-off comes only from a
      # successful submit run triggered by schedule or workflow_dispatch whose
      # head commit is on the default branch (a fork PR's "main" is not), never
      # from another workflow's artifact. There is no "since the last collect":
      # every such run CREATED within lookback_days (config.json; the vendor
      # keeps results 29 days) is listed, oldest first, every time. A batch an
      # earlier run already deleted comes back 404 and collect.py skips it as
      # ALREADY_COLLECTED; one older than stale_handoff_days is refused there as
      # HANDOFF_STALE and deleted. A failed download is reported by run id, the
      # rest still go to the collector, the step fails, and the next run
      # retries it.
      - name: Download every uncollected submit hand-off
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/wiring-audit"
          mkdir -p "$dest"
          : > "$dest/handoffs.txt"
          trusted_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$1" HEAD 2>/dev/null
          }
          # The window, validated as the config loader validates it (whole days >= 1,
          # lookback_days >= stale_handoff_days); anything else fails closed.
          if ! days="$(jq -er 'if (.lookback_days | type) == "number" and (.stale_handoff_days | type) == "number"
                and .lookback_days == (.lookback_days | floor) and .lookback_days >= 1
                and .lookback_days >= .stale_handoff_days then .lookback_days else error("bad") end' \
                scripts/audit/config.json)"; then
            echo "::error title=wiring-audit::CONFIG: lookback_days in scripts/audit/config.json must be a whole number of days, at least 1 and at least stale_handoff_days"
            exit 1
          fi
          cutoff="$(jq -rn --argjson d "$days" 'now - $d * 86400 | strftime("%Y-%m-%dT%H:%M:%SZ")')"
          echo "wiring-audit: listing trusted successful submit runs created since ${cutoff} (${days} days)"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow wiring-audit-submit.yml --branch "$DEFAULT_BRANCH" --status success --created ">=${cutoff}" --limit 500 --json databaseId,createdAt,headSha,event \
            | jq -r --arg cutoff "$cutoff" 'map(select((.event == "schedule" or .event == "workflow_dispatch") and .createdAt >= $cutoff)) | sort_by(.createdAt) | .[] | "\(.databaseId) \(.headSha)"' \
            > "$dest/runs.txt"
          failed=0
          while read -r run_id sha; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error title=wiring-audit::ARTIFACT_INVALID: unexpected run id"; failed=1; continue; }
            if ! trusted_sha "$sha"; then
              echo "wiring-audit: skipping submit run ${run_id}: its head commit is not on the default branch"
              continue
            fi
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "wiring-audit-batch-${run_id}" \
                --dir "$dest/$run_id"; then
              echo "::error title=wiring-audit::DOWNLOAD_FAILED: the hand-off of submit run ${run_id} could not be downloaded; it will be retried by the next collect run"
              failed=1
              continue
            fi
            echo "$dest/$run_id/wiring-audit-batch.json" >> "$dest/handoffs.txt"
          done < "$dest/runs.txt"
          echo "wiring-audit: $(wc -l < "$dest/handoffs.txt") hand-off(s) to collect"
          exit "$failed"

      # Runs after a failed download too (whatever did download is still
      # checked and deleted), but not when the job was cancelled. No hand-off
      # at all makes the collector fail with NO_HANDOFF.
      - name: Check each batch, file findings and delete each batch
        if: ${{ !cancelled() }}
        env:
          WIRING_AUDIT_API_KEY: ${{ secrets.WIRING_AUDIT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/wiring-audit/handoffs.txt"
          args=()
          if [ -f "$list" ]; then
            while IFS= read -r handoff; do
              args+=(--artifact "$handoff")
            done < "$list"
          fi
          python3 -I scripts/audit/collect.py --config scripts/audit/config.json "${args[@]}"
