name: Wiring audit (collect)

# Weekly "is it wired" audit, step 2 of 2 (card #224, ADR 0002). A day after
# wiring-audit-submit.yml, downloads the batch hand-off of every submit run it
# has not collected yet (default branch, oldest first), checks each batch against the
# result contract (ended, every request present once and succeeded, end_turn,
# schema-valid output, the canary's defect reported), files the findings as
# issues through the REST API, logs the actual cost, and deletes the batch on
# every exit path. Code and config: scripts/audit/ (the cron below is pinned
# to config.json by a test).
#
# Model output never reaches a shell: the only step that sees it is the
# Python collector, which posts validated, escaped fields. Conditions as in
# the submit workflow: GitHub-hosted, schedule and dispatch only, default
# branch and wiring-audit environment only, SHA pins, least privilege.

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

# Nothing by default; the job grants only what it uses.
permissions: {}

concurrency:
  group: wiring-audit-collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: wiring-audit
    # Longer than the 600 s cancel timeout in config.json.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Require the wiring-audit API key
        env:
          WIRING_AUDIT_API_KEY: ${{ secrets.WIRING_AUDIT_API_KEY }}
        run: |
          if [ -z "${WIRING_AUDIT_API_KEY//[[:space:]]/}" ]; then
            echo "::error title=wiring-audit::MISSING_SECRET: the WIRING_AUDIT_API_KEY secret is not set in the wiring-audit environment. Add the dedicated audit key there (ADR 0002 condition 4)."
            exit 1
          fi
          echo "wiring-audit: WIRING_AUDIT_API_KEY is set"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      # Attack sketch T10: hand-offs come only from successful runs of the
      # submit workflow on the default branch, never from another workflow's
      # artifact. Every such run that finished after the last successful
      # collect run started is taken (not only the newest), oldest first; with
      # no earlier collect run, every one inside stale_handoff_days. The list
      # of downloaded files is the only thing passed to the next step.
      - name: Download every uncollected submit hand-off
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/wiring-audit"
          mkdir -p "$dest"
          : > "$dest/handoffs.txt"
          since="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wiring-audit-collect.yml \
            --branch "$DEFAULT_BRANCH" --status success --limit 1 --json createdAt \
            --jq '.[0].createdAt // empty')"
          if [ -z "$since" ]; then
            days="$(jq -r '.stale_handoff_days' scripts/audit/config.json)"
            [[ "$days" =~ ^[0-9]+$ ]] || { echo "::error title=wiring-audit::CONFIG: stale_handoff_days is not a whole number"; exit 1; }
            since="$(date -u -d "-${days} days" +%Y-%m-%dT%H:%M:%SZ)"
          fi
          [[ "$since" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || { echo "::error title=wiring-audit::CONFIG: unexpected run timestamp"; exit 1; }
          echo "wiring-audit: collecting submit runs that finished after ${since}"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow wiring-audit-submit.yml \
            --branch "$DEFAULT_BRANCH" --status success --limit 100 --json databaseId,createdAt,updatedAt \
            | jq -r --arg since "$since" 'sort_by(.createdAt) | .[] | select(.updatedAt > $since) | .databaseId' \
            > "$dest/runs.txt"
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "::error title=wiring-audit::ARTIFACT_INVALID: unexpected run id"; exit 1; }
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "wiring-audit-batch-${run_id}" \
              --dir "$dest/$run_id"
            echo "$dest/$run_id/wiring-audit-batch.json" >> "$dest/handoffs.txt"
          done < "$dest/runs.txt"
          echo "wiring-audit: $(wc -l < "$dest/handoffs.txt") hand-off(s) to collect"

      # No hand-off still runs the collector, which then fails with NO_HANDOFF.
      - name: Check each batch, file findings and delete each batch
        env:
          WIRING_AUDIT_API_KEY: ${{ secrets.WIRING_AUDIT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r handoff; do
            args+=(--artifact "$handoff")
          done < "$RUNNER_TEMP/wiring-audit/handoffs.txt"
          python3 -I scripts/audit/collect.py --config scripts/audit/config.json "${args[@]}"
