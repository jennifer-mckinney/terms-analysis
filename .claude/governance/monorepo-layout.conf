# monorepo-layout.conf: pinned values for the #125 monorepo merge checks
# (plan docs/plans/2026-10-12-125-monorepo-merge.md, sections 2.4, 4.7 and 8).
# Read by src/backend/tests/test_monorepo_import.py (stage import, PR 1).
# One key=value per line. Lines starting with '#' and blank lines are ignored.
# Every key below is required; unknown, duplicate or malformed keys and any
# character outside printable ASCII fail closed at load. Commit ids are full
# 40-hex lowercase SHA-1s. Paths are repo-relative, with segments of letters,
# digits, '.', '_' or '-' only.

# Where the ingester history is fetched from (plan 2.4 step 3).
ingester_remote_url=https://github.com/jennifer-mckinney/legal-corpus-ingester
# legal-corpus-ingester main tip that is imported, frozen until PR 2 merges.
ingester_tip=50ca236eb662f11581d67eceaf0e9718cded123a
# The ingester's only root commit (plan section 8 check 3).
ingester_root_commit=6a29e69df170ce6317527546f7b7806c67bf6567
# terms-analysis main commit the import branch was cut from.
app_anchor=5600b5845c712b8a217c929a5d73ed3d41f578dc
# Where the ingester tree lives after the relocation commit.
ingester_prefix=packages/ingester
# Ingester-relative files whose history `git log --follow` must carry across
# the relocation. Space-separated. The last one was itself renamed inside the
# ingester's history, so --follow has to cross two renames.
follow_probe_paths=pyproject.toml .gitignore tests/fixtures/static/eurlex_legal_notice.yaml
# Time cap for each git (or scanner) call made by the checks, in seconds.
git_timeout_seconds=120
# Output cap for each git (or scanner) call, stdout and stderr each, in bytes.
max_git_output_bytes=33554432
# Longest piece of git or scanner output quoted in a failure message, after
# escaping to printable ASCII.
max_message_chars=200
