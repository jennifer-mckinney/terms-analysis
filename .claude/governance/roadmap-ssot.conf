# roadmap-ssot.conf: configuration for scripts/governance/check-roadmap-ssot.sh (#156).
# One key=value per line. Lines starting with '#' and blank lines are ignored.
# Every key below is required; unknown, duplicate or malformed keys fail closed
# (exit 2). Values are printable ASCII. Paths are repo-relative, with segments
# of letters, digits, '.', '_' or '-' only.

# The optional sprint list. Absent, or a dated sprint list linking the roadmap.
todo_path=docs/TODO.md
# The single roadmap: the BRD and the heading of its roadmap section.
brd_path=docs/BRD_Terms_Policies_Reviewer.md
roadmap_heading=## Implementation Roadmap
# Word the sprint list's first heading must contain, next to a date range.
sprint_keyword=Sprint
# Space-separated pathspecs searched (git grep) for references to todo_path.
reference_scope=.claude README.md
# The roadmap section must have at least this many checked task boxes.
min_checked_boxes=1
# Size cap for each markdown file read (bytes).
max_doc_bytes=1048576
# Time and output caps for the one git grep call.
git_timeout_seconds=30
max_git_output_bytes=65536
# At most this many referencing files are named in a failure message.
max_listed_hits=20
# Longest single value echoed in a message, after sanitising to printable ASCII.
max_message_chars=120
