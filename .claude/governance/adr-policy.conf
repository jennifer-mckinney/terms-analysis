# ADR policy read by scripts/governance/check-adrs.py (#161, #327).
# Format: one key=value per line; '#' comment lines and blank lines are
# ignored; ASCII only; every key below is required and may appear once.
# List values are separated by spaces. Paths are repo-relative.
adr_dir=docs/adr
# The index lives in adr_dir and is not itself an ADR.
index_file=docs/adr/README.md
# Width of the ADR number in file names and titles. This repo uses 4 digits;
# the ingester's ADRs use 3 (ADR-015), so the widths must never meet.
number_digits=4
# Level-2 headings every ADR must have (a Conditions section is optional).
required_sections=Context Decision Consequences
# First word of the Status field.
statuses=Proposed Accepted Superseded Deprecated Rejected
# A status in this list, on an ADR whose header mentions a hard requirement,
# needs an Approved-by field naming one of the approvers below.
approval_statuses=Accepted
hard_requirement_prefix=HR
# GitHub handles allowed to approve an ADR that amends a hard requirement.
approvers=@jennifer-mckinney
# Largest ADR or index file the checker reads, in bytes (the index of a
# 2000-ADR repo is about 75 KB).
max_doc_bytes=131072
